content_preview: 'IndicF5: High-Quality Text-to-Speech for Indian Languages

  We release

  IndicF5

  , a

  near-human polyglot

  Text-to-Speech (TTS)

  model trained on

  1417 hours

  of high-quality speech from

  Rasa

  ,

  IndicTTS

  ,

  LIMMITS

  , and

  IndicVoices-R

  .

  IndicF5 supports

  11 Indian languages

  :

  Assamese, Bengali, Gujarati, Hindi, Kannada, Malayalam, Marathi, Odia, Punjabi,
  Tamil, Telugu.

  🚀 Installation

  conda create -n indicf5 python=3.10 -y

  conda activate indicf5

  pip install git+https://github.com/ai4bharat/IndicF5.git

  🎙 Usag'
