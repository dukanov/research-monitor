  # VibeVoice-Hindi-LoRA


  ## Model Description


  This repository contains **LoRA (Low-Rank Adaptation) weights** for fine-tuning
  the VibeVoice-7B model for **Hindi text-to-speech synthesis**. These adapter weights
  enable efficient fine-tuning of the base VibeVoice model to generate high-quality,
  natural-sounding Hindi speech '
