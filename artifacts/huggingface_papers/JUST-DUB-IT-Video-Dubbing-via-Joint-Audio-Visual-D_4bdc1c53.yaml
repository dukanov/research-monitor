content_preview: 'Title: JUST-DUB-IT: Video Dubbing via Joint Audio-Visual Diffusion


  Summary:

  Audio-Visual Foundation Models, which are pretrained to jointly generate sound and
  visual content, have recently shown an unprecedented ability to model multi-modal
  generation and editing, opening new opportunities for downstream tasks. Among these
  tasks, video dubbing could greatly benefit from such priors, yet most existing solutions
  still rely on complex, task-specific pipelines that struggle in real-world settings. '
