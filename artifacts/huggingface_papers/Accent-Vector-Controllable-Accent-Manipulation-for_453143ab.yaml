content_preview: 'Title: Accent Vector: Controllable Accent Manipulation for Multilingual
  TTS Without Accented Data


  Summary:

  Accent is an integral part of society, reflecting multiculturalism and shaping how
  individuals express identity. The majority of English speakers are non-native (L2)
  speakers, yet current Text-To-Speech (TTS) systems primarily model American-accented
  English due limited accented data. We propose Accent Vector, a controllable representation
  that enables accent manipulation in multilingual T'
