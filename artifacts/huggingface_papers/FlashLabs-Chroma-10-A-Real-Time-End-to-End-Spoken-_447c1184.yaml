content_preview: 'Title: FlashLabs Chroma 1.0: A Real-Time End-to-End Spoken Dialogue
  Model with Personalized Voice Cloning


  Summary:

  Recent end-to-end spoken dialogue systems leverage speech tokenizers and neural
  audio codecs to enable LLMs to operate directly on discrete speech representations.
  However, these models often exhibit limited speaker identity preservation, hindering
  personalized voice interaction. In this work, we present Chroma 1.0, the first open-source,
  real-time, end-to-end spoken dialogue model'
