content_preview: 'Title: Voxtral TTS


  Summary:

  We introduce Voxtral TTS, an expressive multilingual text-to-speech model that generates
  natural speech from as little as 3 seconds of reference audio. Voxtral TTS adopts
  a hybrid architecture that combines auto-regressive generation of semantic speech
  tokens with flow-matching for acoustic tokens. These tokens are encoded and decoded
  with Voxtral Codec, a speech tokenizer trained from scratch with a hybrid VQ-FSQ
