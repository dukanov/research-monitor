content_preview: 'Title: RIR-Mega-Speech: A Reverberant Speech Corpus with Comprehensive
  Acoustic Metadata and Reproducible Evaluation


  Summary:

  Despite decades of research on reverberant speech, comparing methods remains difficult
  because most corpora lack per-file acoustic annotations or provide limited documentation
  for reproduction. We present RIR-Mega-Speech, a corpus of approximately 117.5 hours
  created by convolving LibriSpeech utterances with roughly 5,000 simulated room impulse
  responses from the RIR-Meg'
