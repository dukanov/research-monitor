reason: Introduces Progress-Monitoring Rotary Position Embedding (PM-RoPE) for duration
  control and demonstrates that encoder-decoder architectures can maintain better
  text conditioning than decoder-only models for zero-shot voice cloning, though the
  core approach builds incrementally on existing codec language models.
