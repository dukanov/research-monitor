content_preview: 'Title: SwanVoice: Expressive Long-Form Zero-Shot Speech Synthesis
  for Both Monologue and Dialogue


  Summary:

  Zero-shot text-to-speech (TTS) has improved substantially for single-speaker synthesis,
  yet expressive long-form multi-speaker dialogue remains difficult. A common workaround
  is to synthesize each turn with a monologue TTS model and stitch the outputs together.
  This adds inference cost and often breaks acoustic consistency, conversational coherence,
  and affective continuity across turns. R'
