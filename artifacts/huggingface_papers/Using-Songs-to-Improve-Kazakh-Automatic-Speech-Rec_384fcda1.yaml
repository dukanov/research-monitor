content_preview: 'Title: Using Songs to Improve Kazakh Automatic Speech Recognition


  Summary:

  Developing automatic speech recognition (ASR) systems for low-resource languages
  is hindered by the scarcity of transcribed corpora. This proof-of-concept study
  explores songs as an unconventional yet promising data source for Kazakh ASR. We
  curate a dataset of 3,013 audio-text pairs (about 4.5 hours) from 195 songs by 36
  artists, segmented at the lyric-line level. Using Whisper as the base recogniser,
  we fine-tune model'
