  Summary:

  In this report, we present the Qwen3-TTS series, a family of advanced multilingual,
  controllable, robust, and streaming text-to-speech models. Qwen3-TTS supports state-of-the-art
  3-second voice cloning and description-based control, allowing both the creation
  of entirely novel voices and fine-grained manipulation over the output speech. Trained
  on over 5 million hours of speech data spanning 10 languages, Qwen3-TTS adopts a
