content_preview: 'Title: UniT: Unified Multimodal Chain-of-Thought Test-time Scaling


  Summary:

  Unified models can handle both multimodal understanding and generation within a
  single architecture, yet they typically operate in a single pass without iteratively
  refining their outputs. Many multimodal tasks, especially those involving complex
  spatial compositions, multiple interacting objects, or evolving instructions, require
  decomposing instructions, verifying intermediate results, and making iterative corrections'
