  Summary:

  Room acoustics analysis plays a central role in architectural design, audio engineering,
  speech intelligibility assessment, and hearing research. Despite the availability
  of standardized metrics such as reverberation time, clarity, and speech transmission
  index, accessible tools that combine rigorous signal processing with intuitive visualization
  remain scarce.'
