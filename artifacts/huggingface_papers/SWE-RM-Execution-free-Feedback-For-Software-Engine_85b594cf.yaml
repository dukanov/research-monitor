content_preview: 'Title: SWE-RM: Execution-free Feedback For Software Engineering
  Agents


  Summary:

  Execution-based feedback like unit testing is widely used in the development of
  coding agents through test-time scaling (TTS) and reinforcement learning (RL). This
  paradigm requires scalable and reliable collection of unit test cases to provide
  accurate feedback, and the resulting feedback is often sparse and cannot effectively
  distinguish between trajectories that are both successful or both unsuccessful.
