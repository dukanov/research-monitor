content_preview: 'Title: Introducing MELI: the Mandarin-English Language Interview
  Corpus


  Authors: Unknown


  Abstract:

  We introduce the Mandarin-English Language Interview (MELI) Corpus, an open-source
  resource of 29.8 hours of speech from 51 Mandarin-English bilingual speakers. MELI
  combines matched sessions in Mandarin and English with two speaking styles: read
  sentences and spontaneous interviews about language varieties, standardness, and
  learning experiences. Audio was recorded at 44.1 kHz (16-bit, stereo). '
