  Authors: Unknown


  Abstract:

  Building state-of-the-art text-to-speech (TTS) systems typically demands millions
  of hours of proprietary data and complex multi-stage architectures, creating substantial
  barriers for resource-constrained research teams. In this report, we present PilotTTS,
  a lightweight autoregressive TTS system that achieves competitive performance through
  minimalist architecture and rigorous data engine'
