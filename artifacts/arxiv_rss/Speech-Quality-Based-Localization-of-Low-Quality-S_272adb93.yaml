content_preview: 'Title: Speech Quality-Based Localization of Low-Quality Speech and
  Text-to-Speech Synthesis Artefacts


  Authors: Unknown


  Abstract:

  A large number of works view the automatic assessment of speech from an utterance-
  or system-level perspective. While such approaches are good in judging overall quality,
  they cannot adequately explain why a certain score was assigned to an utterance.
  frame-level scores can provide better interpretability, but models predicting them
  are harder to tune and regularize '
