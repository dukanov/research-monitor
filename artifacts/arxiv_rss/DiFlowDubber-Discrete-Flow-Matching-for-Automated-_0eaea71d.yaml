content_preview: 'Title: DiFlowDubber: Discrete Flow Matching for Automated Video
  Dubbing via Cross-Modal Alignment and Synchronization


  Authors: Unknown


  Abstract:

  Video dubbing requires content accuracy, expressive prosody, high-quality acoustics,
  and precise lip synchronization, yet existing approaches struggle on all four fronts.
  To address these issues, we propose DiFlowDubber, the first video dubbing framework
  built upon a discrete flow matching backbone with a novel two-stage training strategy.
