  Abstract:

  Recent codec-based language models~(LMs) have revolutionized text-to-speech~(TTS).
  However, since standard codecs tightly couple timbre and prosody, continuation-based
  LMs inevitably replicate this entanglement, hindering independent control. Recent
  efforts attempt to break this entanglement via codec design, but insufficient decoupling
