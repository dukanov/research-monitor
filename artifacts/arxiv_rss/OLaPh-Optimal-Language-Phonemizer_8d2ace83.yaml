content_preview: 'Title: OLaPh: Optimal Language Phonemizer


  Authors: Unknown


  Abstract:

  Phonemization is a critical component in text-to-speech synthesis. Traditional approaches
  rely on deterministic transformations and lexica, while neural methods offer potential
  for higher generalization on out-of-vocabulary (OOV) terms. This work introduces
  OLaPh (Optimal Language Phonemizer), a hybrid framework that integrates extensive
  multilingual lexica with advanced NLP techniques and a statistical subword segmentation
