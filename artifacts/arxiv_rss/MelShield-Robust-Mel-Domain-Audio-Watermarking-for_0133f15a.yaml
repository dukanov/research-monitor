content_preview: 'Title: MelShield: Robust Mel-Domain Audio Watermarking for Provenance
  Attribution of AI Generated Synthesized Speech


  Authors: Unknown


  Abstract:

  In this paper, we propose MelShield, a robust, in-generation, keyed audio watermarking
  framework that embeds identifiable signals into AI-generated audio for copyright
  protection and reliable attribution. Specifically, MelShield operates in the Mel-spectrogram
  domain during the generation process, targeting intermediate acoustic representations
  in Mel-'
