content_preview: 'Title: ALARM: Audio-Language Alignment for Reasoning Models


  Authors: Unknown


  Abstract:

  Large audio language models (ALMs) extend LLMs with auditory understanding. A common
  approach freezes the LLM and trains only an adapter on self-generated targets. However,
  this fails for reasoning LLMs (RLMs) whose built-in chain-of-thought traces expose
  the textual surrogate input, yielding unnatural responses. We propose self-rephrasing,
  converting self-generated responses into audio-understanding variant'
