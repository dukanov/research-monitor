  Abstract:

  Fine-grained local timing control is still absent from modern text-to-speech systems:
  existing approaches typically provide only utterance-level duration or global speaking-rate
  control, while precise token-level timing manipulation remains unavailable. To the
  best of our knowledge, MAGIC-TTS is the first TTS model with explicit local timing
