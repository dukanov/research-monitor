  Abstract:

  Closed-Set speaker identification aims to assign a speech utterance to one of a
  predefined set of enrolled speakers and requires robust modeling of speaker-specific
  characteristics across multiple temporal scales. While recent deep learning approaches
  have achieved strong performance, many existing architectures provide limited mechanisms
  for modeling temporal dependencies '
