content_preview: 'Title: RO-N3WS: Enhancing Generalization in Low-Resource ASR with
  Diverse Romanian Speech Benchmarks


  Authors: Unknown


  Abstract:

  We introduce RO-N3WS, a benchmark Romanian speech dataset designed to improve generalization
  in automatic speech recognition (ASR), particularly in low-resource and out-of-distribution
  (OOD) conditions. RO-N3WS comprises over 126 hours of transcribed audio collected
  from broadcast news, literary audiobooks, film dialogue, children''s stories, and
  conversational podcast'
