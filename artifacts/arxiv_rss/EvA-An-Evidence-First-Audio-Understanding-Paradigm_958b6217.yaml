content_preview: 'Title: EvA: An Evidence-First Audio Understanding Paradigm for LALMs


  Authors: Unknown


  Abstract:

  Large Audio Language Models (LALMs) still struggle in complex acoustic scenes because
  they often fail to preserve task-relevant acoustic evidence before reasoning begins.
  We identify this error pattern as the evidence bottleneck: state-of-the-art systems
  show larger deficits in acoustic evidence extraction than in downstream reasoning,
  suggesting that upstream perception is often the limiting factor'
