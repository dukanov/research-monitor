  Emotion Recognition with Audio-Language Models


  Authors: Unknown


  Abstract:

  Speech Emotion Recognition models typically use single categorical labels, overlooking
  the inherent ambiguity of human emotions. Ambiguous Emotion Recognition addresses
  this by representing emotions as probability distributions, but progress is limited
  by unreliable ground-truth distributions inferred from sparse human annotations.
