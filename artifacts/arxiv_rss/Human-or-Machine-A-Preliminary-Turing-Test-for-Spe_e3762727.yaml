content_preview: 'Title: Human or Machine? A Preliminary Turing Test for Speech-to-Speech
  Interaction


  Authors: Unknown


  Abstract:

  The pursuit of human-like conversational agents has long been guided by the Turing
  test. For modern speech-to-speech (S2S) systems, a critical yet unanswered question
  is whether they can converse like humans. To tackle this, we conduct the first Turing
  test for S2S systems, collecting 2,968 human judgments on dialogues between 9 state-of-the-art
  S2S systems and 28 human participants. '
