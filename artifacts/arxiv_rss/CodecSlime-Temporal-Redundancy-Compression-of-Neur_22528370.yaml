content_preview: 'Title: CodecSlime: Temporal Redundancy Compression of Neural Speech
  Codec via Dynamic Frame Rate


  Authors: Unknown


  Abstract:

  Neural speech codecs have been widely used in audio compression and various downstream
  tasks. Current mainstream codecs are fixed-frame-rate (FFR), which allocate the
  same number of tokens to every equal-duration slice. However, speech is inherently
  non-uniform in temporal information density. As a result, many tokens are wasted
  on steady-state segments like long vowels a'
