content_preview: 'Title: PlanRAG-Audio: Planning and Retrieval Augmented Generation
  for Long-form Audio Understanding


  Authors: Unknown


  Abstract:

  Long-form audio understanding poses significant challenges for large audio language
  models (LALMs) due to the extreme length of audio sequences and the need to reason
  over heterogeneous acoustic cues distributed over time, such as speech content,
  speaker identity, emotion, and sound events. To address these challenges, we propose
  \textbf{PlanRAG-Audio}, a planning-base'
