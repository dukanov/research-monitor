  Disentangled Embeddings


  Authors: Unknown


  Abstract:

  Morphing techniques generate artificial biometric samples that combine features
  from multiple individuals, allowing each contributor to be verified against a single
  enrolled template. While extensively studied in face recognition, this vulnerability
  remains largely unexplored in voice biometrics. Prior work on voice morphing is
  computationally expensive, non-scalable, and limited '
