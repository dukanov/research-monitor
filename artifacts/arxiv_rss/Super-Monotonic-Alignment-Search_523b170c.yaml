content_preview: 'Title: Super Monotonic Alignment Search


  Authors: Unknown


  Abstract:

  Monotonic alignment search (MAS), introduced by Glow-TTS, is one of the most popular
  algorithm in text-to-speech to estimate unknown alignments between text and speech.
  Since this algorithm needs to search for the most probable alignment with dynamic
  programming by caching all possible paths, the time complexity of the algorithm
  is $O(T \times S)$, where $T$ is the length of text and $S$ is the length of speech
  representation. '
