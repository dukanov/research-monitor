  Abstract:

  Current non-autoregressive (NAR) text-to-speech (TTS) systems still struggle to
  model diverse and speaker-dependent duration variation. We further observe that
  richer duration variation can increase the synthesis difficulty of existing HiFi-GAN-based
  vocoders, leading to spectral artifacts and unstable time-frequency structures.
