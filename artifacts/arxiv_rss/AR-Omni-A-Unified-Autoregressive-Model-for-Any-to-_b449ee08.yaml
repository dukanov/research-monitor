  Abstract:

  Real-world perception and interaction are inherently multimodal, encompassing not
  only language but also vision and speech, which motivates the development of "Omni"
  MLLMs that support both multimodal inputs and multimodal outputs. While a sequence
  of omni MLLMs has emerged, most existing systems still rely on additional expert
