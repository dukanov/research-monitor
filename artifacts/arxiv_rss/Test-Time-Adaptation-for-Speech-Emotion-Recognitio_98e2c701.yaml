content_preview: 'Title: Test-Time Adaptation for Speech Emotion Recognition


  Authors: Unknown


  Abstract:

  The practical utility of Speech Emotion Recognition (SER) systems is undermined
  by their fragility to domain shifts, such as speaker variability, the distinction
  between acted and naturalistic emotions, and cross-corpus variations. While domain
  adaptation and fine-tuning are widely studied, they require either source data or
  labelled target data, which are often unavailable or raise privacy concerns in SER.
