content_preview: 'Title: Borderless Long Speech Synthesis


  Authors: Unknown


  Abstract:

  Most existing text-to-speech (TTS) systems either synthesize speech sentence by
  sentence and stitch the results together, or drive synthesis from plain-text dialogues
  alone. Both approaches leave models with little understanding of global context
  or paralinguistic cues, making it hard to capture real-world phenomena such as multi-speaker
  interactions (interruptions, overlapping speech), evolving emotional arcs, and varied
  acous'
