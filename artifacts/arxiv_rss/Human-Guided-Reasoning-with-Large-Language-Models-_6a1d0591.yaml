content_preview: 'Title: Human-Guided Reasoning with Large Language Models for Vietnamese
  Speech Emotion Recognition


  Authors: Unknown


  Abstract:

  Vietnamese Speech Emotion Recognition (SER) remains challenging due to ambiguous
  acoustic patterns and the lack of reliable annotated data, especially in real-world
  conditions where emotional boundaries are not clearly separable. To address this
  problem, this paper proposes a human-machine collaborative framework that integrates
  human knowledge into the learning process'
