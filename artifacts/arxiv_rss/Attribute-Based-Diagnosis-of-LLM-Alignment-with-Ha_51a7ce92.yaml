content_preview: 'Title: Attribute-Based Diagnosis of LLM Alignment with Hate Speech
  Annotations


  Authors: Unknown


  Abstract:

  Hate speech annotation is costly, subjective, and prone to annotator disagreement,
  making large-scale dataset construction challenging. We systematically analyze how
  well large language models (LLMs) align with human judgments across ten theoretically
  grounded subjective attributes, such as dehumanization, violence, and sentiment,
  evaluating both small and large variants of Llama 3.1 and Q'
