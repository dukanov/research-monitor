content_preview: 'Title: Do Neural Codecs Generalize? A Controlled Study Across Unseen
  Languages and Non-Speech Tasks


  Authors: Unknown


  Abstract:

  This paper investigates three crucial yet underexplored aspects of the generalization
  capabilities of neural audio codecs (NACs): (i) whether NACs can generalize to unseen
  languages during pre-training, (ii) whether speech-only pre-trained NACs can effectively
  generalize to non-speech applications such as environmental sounds, music, and animal
  vocalizations, and (iii)'
