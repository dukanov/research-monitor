  Abstract:

  Emotional text-to-speech (TTS) systems sturggle to capture the full spectrum of
  human emotions due to the inherent complexity of emotional expressions and the limited
  coverage of existing emotion labels. To address this, we propose a language model-based
  TTS framework that synthesizes speech across a broad range of emotional styles.
