content_preview: 'Title: Semantic Codebooks as Effective Priors for Neural Speech
  Compression


  Authors: Unknown


  Abstract:

  Speech codecs are traditionally optimized for waveform fidelity, allocating bits
  to preserve acoustic detail even when much of it can be inferred from linguistic
  structure. This leads to inefficient compression and suboptimal performance on downstream
  recognition tasks. We propose SemDAC, a semantic-aware neural audio codec that leverages
