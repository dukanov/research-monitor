content_preview: 'Title: Doing More with Less: Data Augmentation for Sudanese Dialect
  Automatic Speech Recognition


  Authors: Unknown


  Abstract:

  Although many Automatic Speech Recognition (ASR) systems have been developed for
  Modern Standard Arabic (MSA) and Dialectal Arabic (DA), few studies have focused
  on dialect-specific implementations, particularly for low-resource Arabic dialects
  such as Sudanese. This paper presents a comprehensive study of data augmentation
  techniques for fine-tuning OpenAI Whisper models'
