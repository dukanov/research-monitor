  Abstract:

  Speech Emotion Recognition (SER) has significant potential for mobile applications,
  yet deployment remains constrained by the computational demands of state-of-the-art
  transformer architectures. This paper presents a mobile-efficient SER system based
  on DistilHuBERT, a distilled and 8-bit quantized transformer that achieves 92% parameter
