content_preview: 'Title: VoxEmo: Benchmarking Speech Emotion Recognition with Speech
  LLMs


  Authors: Unknown


  Abstract:

  Speech Large Language Models (LLMs) show great promise for speech emotion recognition
  (SER) via generative interfaces. However, shifting from closed-set classification
  to open text generation introduces zero-shot stochasticity, making evaluation highly
  sensitive to prompts. Additionally, conventional speech LLMs benchmarks overlook
  the inherent ambiguity of human emotion. Hence, we present VoxEmo'
