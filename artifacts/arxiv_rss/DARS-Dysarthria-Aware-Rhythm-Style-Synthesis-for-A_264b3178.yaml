content_preview: 'Title: DARS: Dysarthria-Aware Rhythm-Style Synthesis for ASR Enhancement


  Authors: Unknown


  Abstract:

  Dysarthric speech exhibits abnormal prosody and significant speaker variability,
  presenting persistent challenges for automatic speech recognition (ASR). While text-to-speech
  (TTS)-based data augmentation has shown potential, existing methods often fail to
  accurately model the pathological rhythm and acoustic style of dysarthric speech.
  To address this, we propose DARS, a dysarthria-aware rhythm'
