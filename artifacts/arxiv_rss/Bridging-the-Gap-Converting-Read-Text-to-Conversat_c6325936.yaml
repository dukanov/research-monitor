  Abstract:

  In recent advancements within speech processing, converting read speech to conversational
  speech has gained significant attention. The primary challenge in this domain is
  maintaining naturalness and intelligibility while minimizing computational overhead
  for real-time applications. Traditional read speech often lacks the nuanced prosodic
  variation essential for natural conversational interaction'
