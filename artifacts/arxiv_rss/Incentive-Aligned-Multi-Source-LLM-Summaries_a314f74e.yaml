content_preview: 'Title: Incentive-Aligned Multi-Source LLM Summaries


  Authors: Unknown


  Abstract:

  Large language models (LLMs) are increasingly used in modern search and answer systems
  to synthesize multiple, sometimes conflicting, texts into a single response, yet
  current pipelines offer weak incentives for sources to be accurate and are vulnerable
  to adversarial content. We introduce Truthful Text Summarization (TTS), an incentive-aligned
  framework that improves factual robustness without ground-truth labels. '
