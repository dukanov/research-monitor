content_preview: 'Title: Towards Fine-Grained Code-Switch Speech Translation with
  Semantic Space Alignment


  Authors: Unknown


  Abstract:

  Code-switching (CS) speech translation (ST) aims to translate speech that alternates
  between multiple languages into a target language text, posing significant challenges
  due to the complexity of semantic modeling and the scarcity of CS data. Previous
  studies mainly rely on the models themselves to implicitly learn semantic representations
  and resort to costly manual annotations.'
