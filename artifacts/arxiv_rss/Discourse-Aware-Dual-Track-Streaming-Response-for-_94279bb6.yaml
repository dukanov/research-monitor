content_preview: 'Title: Discourse-Aware Dual-Track Streaming Response for Low-Latency
  Spoken Dialogue Systems


  Authors: Unknown


  Abstract:

  Achieving human-like responsiveness is a critical yet challenging goal for cascaded
  spoken dialogue systems. Conventional ASR-LLM-TTS pipelines follow a strictly sequential
  paradigm, requiring complete transcription and full reasoning before speech synthesis
  can begin, which results in high response latency. We propose the Discourse-Aware
  Dual-Track Streaming Response (DDTSR)'
