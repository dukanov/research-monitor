content_preview: 'Title: UrgentMOS: Unified Multi-Metric and Preference Learning for
  Robust Speech Quality Assessment


  Authors: Unknown


  Abstract:

  Automatic speech quality assessment has become increasingly important as modern
  speech generation systems continue to advance, while human listening tests remain
  costly, time-consuming, and difficult to scale. Most existing learning-based assessment
  models rely primarily on scarce human-annotated mean opinion score (MOS) data, which
  limits robustness and generalization'
