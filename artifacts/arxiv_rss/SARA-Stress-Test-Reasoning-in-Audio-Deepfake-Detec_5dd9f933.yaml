content_preview: 'Title: SARA: Stress Test Reasoning in Audio Deepfake Detection


  Authors: Unknown


  Abstract:

  Audio Language Models (ALMs) offer a promising shift towards explainable audio deepfake
  detections (ADD), moving beyond \textit{black-box} classifiers by providing transparency
  to their predictions via reasoning traces. However, such reasoning may not support
  the model predictions, reflecting poor coherence, or, worse, may rationalize incorrect
  predictions with plausible but misleading explanation. Moreov'
