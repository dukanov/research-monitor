  Abstract:

  An accurate assessment of L2 English pronunciation is crucial for language learning,
  as it provides personalized feedback and ensures a fair evaluation of individual
  progress. However, automated scoring remains challenging due to the complexity of
  sentence-level fluency, prosody, and completeness. This paper evaluates the zero-shot
  performance of Qwen2-Audio-7B-Instruc'
