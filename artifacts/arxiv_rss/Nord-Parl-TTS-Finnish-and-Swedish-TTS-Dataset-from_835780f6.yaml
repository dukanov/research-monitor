  Speech


  Authors: Unknown


  Abstract:

  Text-to-speech (TTS) development is limited by scarcity of high-quality, publicly
  available speech data for most languages outside a few high-resource languages.
  We present Nord-Parl-TTS, an open TTS dataset for Finnish and Swedish based on speech
  found in the wild. Using recordings of Nordic parliamentary proceedings, we extract
  900 hours of Finnish and 5090 hours of Swedish speech suitable'
