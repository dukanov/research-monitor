content_preview: 'Title: Mitigating Structural Noise in Low-Resource S2TT: An Optimized
  Cascaded Nepali-English Pipeline with Punctuation Restoration


  Authors: Unknown


  Abstract:

  This paper presents and evaluates an optimized cascaded Nepali speech-to-English
  text translation (S2TT) system, focusing on mitigating structural noise introduced
  by Automatic Speech Recognition (ASR). We first establish highly proficient ASR
  and NMT components: a Wav2Vec2-XLS-R-300m model achieved a state-of-the-art 2.72%
  CER on OpenSL'
