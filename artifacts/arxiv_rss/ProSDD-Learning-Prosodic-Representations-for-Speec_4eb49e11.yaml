content_preview: 'Title: ProSDD: Learning Prosodic Representations for Speech Deepfake
  Detection against Expressive and Emotional Attacks


  Authors: Unknown


  Abstract:

  Speech deepfake detection (SDD) systems perform well on standard benchmarks datasets
  but often fail to generalize to expressive and emotional spoofing attacks. Many
  methods rely on spoof-heavy training data, learning dataset-specific artifacts rather
  than transferable cues of natural speech. In contrast, humans internalize variability
  in real speech'
