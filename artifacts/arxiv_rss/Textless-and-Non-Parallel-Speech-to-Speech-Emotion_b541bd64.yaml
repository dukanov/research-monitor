reason: The work introduces a textless, non-parallel framework for zero-shot emotion
  transfer that combines semantic tokens, speaker representations, and emotion embeddings
  in an analysis-synthesis pipeline, which is a meaningful contribution to expressive
  speech synthesis though the core components are largely established techniques.
