content_preview: 'Title: Textless and Non-Parallel Speech-to-Speech Emotion Style
  Transfer


  Authors: Unknown


  Abstract:

  Given a pair of source and reference speech recordings, speech-to-speech (S2S) emotion
  style transfer involves the generation of an output speech that mimics the emotion
  characteristics of the reference while preserving the content and speaker attributes
  of the source. In this paper, we propose a speech-to-speech zero-shot emotion style
  transfer framework, termed S2S Zero-shot Emotion Style Tran'
