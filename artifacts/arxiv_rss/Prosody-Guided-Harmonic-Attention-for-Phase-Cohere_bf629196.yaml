content_preview: 'Title: Prosody-Guided Harmonic Attention for Phase-Coherent Neural
  Vocoding in the Complex Spectrum


  Authors: Unknown


  Abstract:

  Neural vocoders are central to speech synthesis; despite their success, most still
  suffer from limited prosody modeling and inaccurate phase reconstruction. We propose
  a vocoder that introduces prosody-guided harmonic attention to enhance voiced segment
  encoding and directly predicts complex spectral components for waveform synthesis
  via inverse STFT. Unlike mel-spectr'
