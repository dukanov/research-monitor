content_preview: 'Title: MimicLM: Zero-Shot Voice Imitation through Autoregressive
  Modeling of Pseudo-Parallel Speech Corpora


  Authors: Unknown


  Abstract:

  Voice imitation aims to transform source speech to match a reference speaker''s
  timbre and speaking style while preserving linguistic content. A straightforward
  approach is to train on triplets of (source, reference, target), where source and
  target share the same content but target matches the reference''s voice characteristics,
  yet such data is extremely scarce'
