  Abstract:

  Large language models (LLMs) are typically deployed with fixed parameters, and their
  performance is often improved by allocating more computation at inference time.
  While such test-time scaling can be effective, it cannot correct model misconceptions
  or adapt the model to the specific structure of an individual query. Test-time optimization
