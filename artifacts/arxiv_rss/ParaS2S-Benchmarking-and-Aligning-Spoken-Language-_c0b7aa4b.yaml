  Abstract:

  Speech-to-Speech (S2S) models have shown promising dialogue capabilities, but their
  ability to handle paralinguistic cues - such as emotion, tone, and speaker attributes
  - and to respond appropriately in both content and style remains under-explored.
  Progress is further hindered by the scarcity of high-quality and expressive demonstrations.
