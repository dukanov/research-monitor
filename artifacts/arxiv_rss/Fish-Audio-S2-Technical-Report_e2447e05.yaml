content_preview: 'Title: Fish Audio S2 Technical Report


  Authors: Unknown


  Abstract:

  We introduce Fish Audio S2, an open-sourced text-to-speech system featuring multi-speaker,
  multi-turn generation, and, most importantly, instruction-following control via
  natural-language descriptions. To scale training, we develop a multi-stage training
  recipe together with a staged data pipeline covering video captioning and speech
  captioning, voice-quality assessment, and reward modeling. To push the frontier
  of open-source TT'
