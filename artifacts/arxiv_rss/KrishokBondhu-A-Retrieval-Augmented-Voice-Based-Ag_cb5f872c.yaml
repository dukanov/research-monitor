content_preview: 'Title: KrishokBondhu: A Retrieval-Augmented Voice-Based Agricultural
  Advisory Call Center for Bengali Farmers


  Authors: Unknown


  Abstract:

  In Bangladesh, many farmers still struggle to access timely, expert-level agricultural
  guidance. This paper presents KrishokBondhu, a voice-enabled, call-centre-integrated
  advisory platform built on a Retrieval-Augmented Generation (RAG) framework for
  Bengali-speaking farmers. The system combines agricultural handbooks, extension
  manuals, and NGO publications'
