content_preview: 'Title: Streaming Speech-to-Text Translation with a SpeechLLM


  Authors: Unknown


  Abstract:

  Normally, a system that translates speech into text consists of separate modules
  for speech recognition and text-to-text translation. Combining those tasks into
  a SpeechLLM promises to exploit paralinguistic information in the speech and to
  reduce cascaded errors. But existing SpeechLLM systems are slow since they do not
  work in a real streaming fashion: they wait for a complete utterance of audio before
