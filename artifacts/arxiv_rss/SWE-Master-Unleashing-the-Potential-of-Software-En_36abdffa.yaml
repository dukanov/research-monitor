content_preview: 'Title: SWE-Master: Unleashing the Potential of Software Engineering
  Agents via Post-Training


  Authors: Unknown


  Abstract:

  In this technical report, we present SWE-Master, an open-source and fully reproducible
  post-training framework for building effective software engineering agents. SWE-Master
  systematically explores the complete agent development pipeline, including teacher-trajectory
  synthesis and data curation, long-horizon SFT, RL with real execution feedback,
  and inference framework design'
