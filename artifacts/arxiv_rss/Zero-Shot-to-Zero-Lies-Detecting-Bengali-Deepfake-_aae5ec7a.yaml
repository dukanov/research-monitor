content_preview: 'Title: Zero-Shot to Zero-Lies: Detecting Bengali Deepfake Audio
  through Transfer Learning


  Authors: Unknown


  Abstract:

  The rapid growth of speech synthesis and voice conversion systems has made deepfake
  audio a major security concern. Bengali deepfake detection remains largely unexplored.
  In this work, we study automatic detection of Bengali audio deepfakes using the
  BanglaFake dataset. We evaluate zeroshot inference with several pretrained models.
  These include Wav2Vec2-XLSR-53, Whisper, PANNsC'
