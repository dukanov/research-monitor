content_preview: 'Title: PAREDA: A Multi-Accent Speech Dataset of Natural Language
  Processing Research Discussions


  Authors: Unknown


  Abstract:

  While modern Automatic Speech Recognition (ASR) systems achieve high accuracy on
  benchmark corpora, their performance often degrades when there is real-world variability.
  This work focuses on variability arising due to accented, spontaneous, and domain-specific
  speech. In particular, we introduce PAper REading DAtaset (PAREDA), a first-of-its-kind
  multi-accent speech data'
