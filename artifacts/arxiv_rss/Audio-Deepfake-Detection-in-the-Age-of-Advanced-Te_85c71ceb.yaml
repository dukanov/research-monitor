  Abstract:

  Recent advances in Text-to-Speech (TTS) systems have substantially increased the
  realism of synthetic speech, raising new challenges for audio deepfake detection.
  This work presents a comparative evaluation of three state-of-the-art TTS models--Dia2,
  Maya1, and MeloTTS--representing streaming, LLM-based, and non-autoregressive architectures.
