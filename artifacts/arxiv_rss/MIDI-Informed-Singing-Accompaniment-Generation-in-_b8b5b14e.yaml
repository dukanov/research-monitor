  Abstract:

  Song generation aims to produce full songs with vocals and accompaniment from lyrics
  and text descriptions, yet end-to-end models remain data- and compute-intensive
  and provide limited editability. We advocate a compositional alternative that decomposes
  the task into melody composition, singing voice synthesis, and singing accompaniment
