content_preview: 'Title: PRiSM: Benchmarking Phone Realization in Speech Models


  Authors: Unknown


  Abstract:

  Phone recognition (PR) serves as the atomic interface for language-agnostic modeling
  for cross-lingual speech processing and phonetic analysis. Despite prolonged efforts
  in developing PR systems, current evaluations only measure surface-level transcription
  accuracy. We introduce PRiSM, the first open-source benchmark designed to expose
  blind spots in phonetic perception through intrinsic and extrinsic eval'
