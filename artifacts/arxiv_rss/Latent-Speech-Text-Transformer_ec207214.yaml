  Abstract:

  Auto-regressive speech-text models pre-trained on interleaved text tokens and discretized
  speech tokens demonstrate strong speech understanding and generation, yet remain
  substantially less compute-efficient than text LLMs, partly due to the much longer
  sequences of speech tokens relative to text. This modality imbalance disproportionately
  allocates pre-training and inference compute to speech, potentially hindering effective
