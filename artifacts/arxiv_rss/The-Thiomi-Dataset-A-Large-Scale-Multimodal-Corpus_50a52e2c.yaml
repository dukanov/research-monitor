content_preview: 'Title: The Thiomi Dataset: A Large-Scale Multimodal Corpus for Low-Resource
  African Languages


  Authors: Unknown


  Abstract:

  We present the Thiomi Dataset, a large-scale multimodal corpus spanning ten African
  languages across four language families: Swahili, Kikuyu, Kamba, Kimeru, Luo, Maasai,
  Kipsigis, Somali (East Africa); Wolof (West Africa); and Fulani (West/Central Africa).
  The dataset contains over 601,000 approved sentence-level text annotations and over
