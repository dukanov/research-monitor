  Abstract:

  While existing audio watermarking techniques have achieved strong robustness against
  traditional digital signal processing (DSP) attacks, they remain vulnerable to neural
  resynthesis. This occurs because modern neural audio codecs act as semantic filters
  and discard the imperceptible waveform variations used in prior watermarking methods.
