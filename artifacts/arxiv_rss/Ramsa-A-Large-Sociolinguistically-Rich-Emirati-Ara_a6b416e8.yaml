content_preview: 'Title: Ramsa: A Large Sociolinguistically Rich Emirati Arabic Speech
  Corpus for ASR and TTS


  Authors: Unknown


  Abstract:

  Ramsa is a developing 41-hour speech corpus of Emirati Arabic designed to support
  sociolinguistic research and low-resource language technologies. It contains recordings
  from structured interviews with native speakers and episodes from national television
  shows. The corpus features 157 speakers (59 female, 98 male), spans subdialects
  such as Urban, Bedouin, and Mountain/Shihhi'
