  Abstract:

  Joint audio-video generation aims to synthesize synchronized multisensory content,
  yet current unified models struggle with fine-grained acoustic control, particularly
  for identity-preserving speech. Existing approaches either suffer from temporal
  misalignment due to cascaded generation or lack the capability to perform zero-shot
