content_preview: 'Title: Multi-Speaker Conversational Audio Deepfake: Taxonomy, Dataset
  and Pilot Study


  Authors: Unknown


  Abstract:

  The rapid advances in text-to-speech (TTS) technologies have made audio deepfakes
  increasingly realistic and accessible, raising significant security and trust concerns.
  While existing research has largely focused on detecting single-speaker audio deepfakes,
  real-world malicious applications with multi-speaker conversational settings is
  also emerging as a major underexplored threat.'
