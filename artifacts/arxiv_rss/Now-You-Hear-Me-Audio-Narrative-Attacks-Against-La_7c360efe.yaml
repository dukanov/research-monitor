content_preview: 'Title: Now You Hear Me: Audio Narrative Attacks Against Large Audio-Language
  Models


  Authors: Unknown


  Abstract:

  Large audio-language models increasingly operate on raw speech inputs, enabling
  more seamless integration across domains such as voice assistants, education, and
  clinical triage. This transition, however, introduces a distinct class of vulnerabilities
  that remain largely uncharacterized. We examine the security implications of this
  modality shift by designing a text-to-audio jailbreak'
