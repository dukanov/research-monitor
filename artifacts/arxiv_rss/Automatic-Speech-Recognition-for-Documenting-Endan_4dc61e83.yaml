content_preview: 'Title: Automatic Speech Recognition for Documenting Endangered Languages:
  Case Study of Ikema Miyakoan


  Authors: Unknown


  Abstract:

  Language endangerment poses a major challenge to linguistic diversity worldwide,
  and technological advances have opened new avenues for documentation and revitalization.
  Among these, automatic speech recognition (ASR) has shown increasing potential to
  assist in the transcription of endangered language data. This study focuses on Ikema,
  a severely endangered Ryukyuan'
