content_preview: 'Title: Frame-Level Internal Tool Use for Temporal Grounding in Audio
  LMs


  Authors: Unknown


  Abstract:

  Large audio language models are increasingly used for complex audio understanding
  tasks, but they struggle with temporal tasks that require precise temporal grounding,
  such as word alignment and speaker diarization. The standard approach, where we
  generate timestamps as sequences of text tokens, is computationally expensive and
  prone to hallucination, especially when processing audio lengths out'
