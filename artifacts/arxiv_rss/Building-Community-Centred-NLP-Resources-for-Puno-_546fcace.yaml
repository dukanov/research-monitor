content_preview: 'Title: Building Community-Centred NLP Resources for Puno Quechua


  Authors: Unknown


  Abstract:

  The preservation of under-resourced languages requires digital tools and resources
  shaped by and for their speakers. We present the first dedicated ASR resources for
  Puno Quechua (ISO 639-3: qxp): (1) the largest speech corpus for any single Quechua
  variety, consisting in 66 hours of recordings for scripted and spontaneous speech
  (including 36 hours of manually transcribed and validated data), collected'
