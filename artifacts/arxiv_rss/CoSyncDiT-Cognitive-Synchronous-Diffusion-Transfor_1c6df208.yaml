content_preview: 'Title: CoSyncDiT: Cognitive Synchronous Diffusion Transformer for
  Movie Dubbing


  Authors: Unknown


  Abstract:

  Movie dubbing aims to synthesize speech that preserves the vocal identity of a reference
  audio while synchronizing with the lip movements in a target video. Existing methods
  fail to achieve precise lip-sync and lack naturalness due to explicit alignment
  at the duration level. While implicit alignment solutions have emerged, they remain
  susceptible to interference from the reference audio,'
