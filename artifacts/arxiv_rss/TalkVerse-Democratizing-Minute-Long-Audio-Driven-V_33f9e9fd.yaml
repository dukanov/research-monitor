content_preview: 'Title: TalkVerse: Democratizing Minute-Long Audio-Driven Video Generation


  Authors: Unknown


  Abstract:

  We introduce TalkVerse, a large-scale, open corpus for single-person, audio-driven
  talking video generation designed to enable fair, reproducible comparison across
  methods. While current state-of-the-art systems rely on closed data or compute-heavy
  models, TalkVerse offers 2.3 million high-resolution (720p/1080p) audio-video synchronized
  clips totaling 6.3k hours. These are curated from over 60'
