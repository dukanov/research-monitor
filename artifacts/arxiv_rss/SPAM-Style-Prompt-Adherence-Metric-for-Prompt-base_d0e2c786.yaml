content_preview: 'Title: SPAM: Style Prompt Adherence Metric for Prompt-based TTS


  Authors: Unknown


  Abstract:

  Prompt-based text-to-speech (TTS) aims to generate speech that adheres to fine-grained
  style cues provided in a text prompt. However, most prior works depend on neither
  plausible nor faithful measures to evaluate prompt adherence. That is, they cannot
  ensure whether the evaluation is grounded on the prompt and is similar to a human.
