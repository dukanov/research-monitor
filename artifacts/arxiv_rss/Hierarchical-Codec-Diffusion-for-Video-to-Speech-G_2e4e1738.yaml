  Abstract:

  Video-to-Speech (VTS) generation aims to synthesize speech from a silent video without
  auditory signals. However, existing VTS methods disregard the hierarchical nature
  of speech, which spans coarse speaker-aware semantics to fine-grained prosodic details.
