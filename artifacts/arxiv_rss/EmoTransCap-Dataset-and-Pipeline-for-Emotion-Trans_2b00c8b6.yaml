content_preview: 'Title: EmoTransCap: Dataset and Pipeline for Emotion Transition-Aware
  Speech Captioning in Discourses


  Authors: Unknown


  Abstract:

  Emotion perception and adaptive expression are fundamental capabilities in human-agent
  interaction. While recent advances in speech emotion captioning (SEC) have improved
  fine-grained emotional modeling, existing systems remain limited to static, single-emotion
  characterization within isolated sentences, neglecting dynamic emotional transitions
  at the discourse level'
