content_preview: 'Title: SACodec: Asymmetric Quantization with Semantic Anchoring
  for Low-Bitrate High-Fidelity Neural Speech Codecs


  Authors: Unknown


  Abstract:

  Neural Speech Codecs face a fundamental trade-off at low bitrates: preserving acoustic
  fidelity often compromises semantic richness. To address this, we introduce SACodec,
  a novel codec built upon an asymmetric dual-quantizer that employs our proposed
  Semantic Anchoring mechanism. This design strategically decouples the quantization
  of Semantic and Acous'
