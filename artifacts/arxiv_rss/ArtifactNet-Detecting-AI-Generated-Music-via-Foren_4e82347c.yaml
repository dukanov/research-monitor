  Abstract:

  We present ArtifactNet, a lightweight framework that detects AI-generated music
  by reframing the problem as forensic physics -- extracting and analyzing the physical
  artifacts that neural audio codecs inevitably imprint on generated audio. A bounded-mask
  UNet (ArtifactUNet, 3.6M parameters) extracts codec residuals from magnitude spectrograms,
  which are then decomposed via HPSS into 7-chan'
