content_preview: 'Title: JaiTTS: A Thai Voice Cloning Model


  Authors: Unknown


  Abstract:

  We present JaiTTS-v1.0, a state-of-the-art Thai voice cloning text-to-speech model
  built through continual training on a large Thai-centric speech corpus. The model
  architecture is adapted from VoxCPM, a tokenizer-free autoregressive TTS model.
  JaiTTS-v1.0 directly processes numerals and Thai-English code-switching, which is
  very common in realistic settings, without explicit text normalization. We test
  the models on short-du'
