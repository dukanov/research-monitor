content_preview: 'Title: Switchcodec: Adaptive residual-expert sparse quantization
  for high-fidelity neural audio coding


  Authors: Unknown


  Abstract:

  Recent neural audio compression models often rely on residual vector quantization
  for high-fidelity coding, but using a fixed number of per-frame codebooks is suboptimal
  for the wide variability of audio content-especially for signals that are either
  very simple or highly complex. To address this limitation, we propose SwitchCodec,
  a neural audio codec based on Resi'
