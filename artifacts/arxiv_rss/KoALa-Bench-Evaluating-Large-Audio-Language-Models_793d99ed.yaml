  Abstract:

  Recent advances in large audio language models (LALMs) have enabled multilingual
  speech understanding. However, benchmarks for evaluating LALMs remain scarce for
  non-English languages, with Korean being one such underexplored case. In this paper,
  we introduce KoALa-Bench, a comprehensive benchmark for evaluating Korean speech
  understanding and speech faithfulnes'
