content_preview: 'Title: TQCodec: Towards neural audio codec for high-fidelity music
  streaming


  Authors: Unknown


  Abstract:

  We propose TQCodec, a neural audio codec designed for high-bitrate, high-fidelity
  music streaming. Unlike existing neural codecs that primarily target ultra-low bitrates
  (<= 16kbps), TQCodec operates at 44.1 kHz and supports bitrates from 32 kbps to
  128 kbps, aligning with the standard quality of modern music streaming platforms.
  The model adopts an encoder-decoder architecture based on SEAN'
