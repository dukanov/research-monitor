content_preview: 'Title: Tibetan-TTS:Low-Resource Tibetan Speech Synthesis with Large
  Model Adaptation


  Authors: Unknown


  Abstract:

  Tibetan text-to-speech (TTS) has long been challenged by scarce speech resources,
  significant dialectal variation, and the complex mapping between written text and
  spoken pronunciation. To address these issues, this work presents, to the best of
  our knowledge, the first large-model-based Tibetan TTS system in the industry, built
  upon a large speech synthesis model developed by Xingch'
