reason: Introduces the first comprehensive benchmark specifically designed to evaluate
  paralinguistic instruction-following capabilities in speech-to-speech models through
  a novel four-level complexity protocol and arena-style evaluation framework that
  operates directly in the speech domain without text intermediates.
