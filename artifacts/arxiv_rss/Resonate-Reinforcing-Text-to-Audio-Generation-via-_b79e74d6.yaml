content_preview: 'Title: Resonate: Reinforcing Text-to-Audio Generation via Online
  Feedback from Large Audio Language Models


  Authors: Unknown


  Abstract:

  Reinforcement Learning (RL) has become an effective paradigm for enhancing Large
  Language Models (LLMs) and visual generative models. However, its application in
  text-to-audio (TTA) generation remains largely under-explored. Prior work typically
  employs offline methods like Direct Preference Optimization (DPO) and leverages
  Contrastive Language-Audio Pretraining'
