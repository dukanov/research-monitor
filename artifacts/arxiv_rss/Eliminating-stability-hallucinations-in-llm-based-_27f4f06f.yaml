content_preview: 'Title: Eliminating stability hallucinations in llm-based tts models
  via attention guidance


  Authors: Unknown


  Abstract:

  This paper focuses on resolving stability hallucinations (e.g., repetitive or omitted
  speech) in LLM-based Text-to-Speech (TTS) models by improving and leveraging the
  attention mechanism. First, we analyzed the alignment mechanism between text tokens
  and speech tokens in LLMs. We then proposed a metric termed the Optimal Alignment
  Score (OAS), which employs the Viterbi algorith'
