  Abstract:

  This work proposes GLM-TTS, a production-level TTS system designed for efficiency,
  controllability, and high-fidelity speech generation. GLM-TTS follows a two-stage
  architecture, consisting of a text-to-token autoregressive model and a token-to-waveform
  diffusion model. With only 100k hours of training data, GLM-TTS achieves state-of-the-art
