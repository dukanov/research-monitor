content_preview: 'Title: WhisperVC: Decoupled Cross-Domain Alignment and Speech Generation
  for Low-Resource Whisper-to-Normal Conversion


  Authors: Unknown


  Abstract:

  Whispered speech lacks vocal-fold excitation, making intelligible conversion challenging.
  We propose WhisperVC, a three-stage framework for low-resource whisper-to-normal
  (W2N) conversion that decouples cross-domain alignment from speech generation. Stage
  1 uses limited paired whisper-normal data with a content encoder and a Conformer-based
  variation'
