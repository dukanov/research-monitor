reason: This work focuses on whisper-to-normal speech conversion rather than emotional/expressive
  synthesis, and while it uses a three-stage decoupled approach, the core techniques
  (VAE, Conformer, HiFi-GAN) are standard components without significant methodological
  innovation for expressive speech.
