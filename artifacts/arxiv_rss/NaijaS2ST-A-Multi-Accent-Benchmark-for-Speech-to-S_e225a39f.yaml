content_preview: 'Title: NaijaS2ST: A Multi-Accent Benchmark for Speech-to-Speech
  Translation in Low-Resource Nigerian Languages


  Authors: Unknown


  Abstract:

  Speech translation for low-resource languages remains fundamentally limited by the
  scarcity of high-quality, diverse parallel speech data, a challenge that is especially
  pronounced in African linguistic contexts. To address this, we introduce NaijaS2ST,
  a parallel speech translation dataset spanning Igbo, Hausa, Yor\`ub\''a, and Nigerian
  Pidgin paired with En'
