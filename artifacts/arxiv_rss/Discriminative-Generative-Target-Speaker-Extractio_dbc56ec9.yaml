content_preview: 'Title: Discriminative-Generative Target Speaker Extraction with
  Decoder-Only Language Models


  Authors: Unknown


  Abstract:

  Target speaker extraction (TSE) aims to recover the speech signal of a desired speaker
  from a mixed audio recording, given a short enrollment utterance. Most existing
  TSE approaches are based on discriminative modeling paradigms. Although effective
  at suppressing interfering speakers, these methods often struggle to produce speech
  with high perceptual quality and naturalness.'
