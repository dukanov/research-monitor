content_preview: 'Title: A Toolkit for Detecting Spurious Correlations in Speech Datasets


  Authors: Unknown


  Abstract:

  We introduce a toolkit for uncovering spurious correlations between recording characteristics
  and target class in speech datasets. Spurious correlations may arise due to heterogeneous
  recording conditions, a common scenario for health-related datasets. When present
  both in the training and test data, these correlations result in an overestimation
  of the system performance -- a dangerous situation'
