  Abstract:

  Multilingual speaker verification (SV) remains challenging due to limited cross-lingual
  data and language-dependent information in speaker embeddings. This paper presents
  a language-invariant multilingual SV system for the TidyVoice 2026 Challenge. We
  adopt the multilingual self-supervised w2v-BERT 2.0 model as the backbone, enhanced
