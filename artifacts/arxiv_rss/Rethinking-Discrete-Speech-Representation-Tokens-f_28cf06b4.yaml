content_preview: 'Title: Rethinking Discrete Speech Representation Tokens for Accent
  Generation


  Authors: Unknown


  Abstract:

  Discrete Speech Representation Tokens (DSRTs) have become a foundational component
  in speech generation. While prior work has extensively studied phonetic and speaker
  information in DSRTs, how accent information is encoded in DSRTs remains largely
  unexplored. In this paper, we present the first systematic investigation of accent
  information in DSRTs. We propose a unified evaluation framewor'
