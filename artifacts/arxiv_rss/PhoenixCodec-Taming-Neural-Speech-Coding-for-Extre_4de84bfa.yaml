  Abstract:

  This paper presents PhoenixCodec, a comprehensive neural speech coding and decoding
  framework designed for extremely low-resource conditions. The proposed system integrates
  an optimized asymmetric frequency-time architecture, a Cyclical Calibration and
  Refinement (CCR) training strategy, and a noise-invariant fine-tuning procedure.
