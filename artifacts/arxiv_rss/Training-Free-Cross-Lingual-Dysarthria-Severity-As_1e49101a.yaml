  Abstract:

  Dysarthric speech severity assessment typically requires trained clinicians or supervised
  models built from labelled pathological speech, limiting scalability across languages
  and clinical settings. We present a training-free method that quantifies dysarthria
  severity by measuring degradation in phonological feature subspaces '
