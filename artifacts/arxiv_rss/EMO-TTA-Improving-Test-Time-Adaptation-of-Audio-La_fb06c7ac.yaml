  Abstract:

  Speech emotion recognition (SER) with audio-language models (ALMs) remains vulnerable
  to distribution shifts at test time, leading to performance degradation in out-of-domain
  scenarios. Test-time adaptation (TTA) provides a promising solution but often relies
  on gradient-based updates or prompt tuning, limiting flexibility and practicality.
