  Abstract:

  Recent work reports gains in neural text-to-speech (TTS) with Group Relative Policy
  Optimization (GRPO). However, in the absence of a verifiable reward for \textit{prosody},
  GRPO trained on transcription-oriented signals (CER/NLL) lowers error rates yet
  collapses prosody into monotone, unnatural speech; adding speaker-similarity further
