  Authors: Unknown


  Abstract:

  Recently, generative speech enhancement has garnered considerable interest; however,
  existing approaches are hindered by excessive complexity, limited efficiency, and
  suboptimal speech quality. To overcome these challenges, this paper proposes a novel
  parallel generative speech enhancement (ParaGSE) framework that leverages a group
  vector quantization (GVQ)'
