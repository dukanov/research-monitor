  Authors: Unknown


  Abstract:

  Automatic Speech Recognition (ASR) and speaker diarization in Bangla remain challenging
  due to long form recordings, diverse acoustic conditions, and significant speaker
  variability. This work addresses these two core tasks in Bangla spoken language
  understanding by developing robust systems for long form ASR and speaker diarization.
