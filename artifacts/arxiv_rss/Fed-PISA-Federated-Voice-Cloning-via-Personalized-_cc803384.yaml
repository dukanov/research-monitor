content_preview: 'Title: Fed-PISA: Federated Voice Cloning via Personalized Identity-Style
  Adaptation


  Authors: Unknown


  Abstract:

  Voice cloning for Text-to-Speech (TTS) aims to generate expressive and personalized
  speech from text using limited data from a target speaker. Federated Learning (FL)
  offers a collaborative and privacy-preserving framework for this task, but existing
  approaches suffer from high communication costs and tend to suppress stylistic heterogeneity,
  resulting in insufficient personalization.'
