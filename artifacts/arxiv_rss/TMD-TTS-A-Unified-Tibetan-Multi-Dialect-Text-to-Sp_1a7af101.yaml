content_preview: 'Title: TMD-TTS: A Unified Tibetan Multi-Dialect Text-to-Speech Framework
  for \"U-Tsang, Amdo and Kham Speech Dataset Generation


  Authors: Unknown


  Abstract:

  Tibetan is a low-resource language with limited parallel speech corpora spanning
  its three major dialects (\"U-Tsang, Amdo, and Kham), limiting progress in speech
  modeling. To address this issue, we propose TMD-TTS, a unified Tibetan multi-dialect
  text-to-speech (TTS) framework that synthesizes parallel dialectal speech from explicit
  dialect'
