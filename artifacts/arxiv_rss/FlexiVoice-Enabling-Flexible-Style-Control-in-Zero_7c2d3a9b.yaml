  Abstract:

  This study proposes FlexiVoice, a text-to-speech (TTS) synthesis system capable
  of flexible style control with zero-shot voice cloning. The speaking style is controlled
  by a natural-language instruction and the voice timbre is provided by a speech reference
  in zero-shot manner. FlexiVoice is built with an LLM core, which takes text as input,
