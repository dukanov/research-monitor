content_preview: 'Title: HOMURA: Taming the Sand-Glass for Time-Constrained LLM Translation
  via Reinforcement Learning


  Authors: Unknown


  Abstract:

  Large Language Models (LLMs) have achieved remarkable strides in multilingual translation
  but are hindered by a systemic cross-lingual verbosity bias, rendering them unsuitable
  for strict time-constrained tasks like subtitling and dubbing. Current prompt-engineering
  approaches struggle to resolve this conflict between semantic fidelity and rigid
  temporal feasibility. '
