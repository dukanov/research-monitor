  Abstract:

  Neural codec language models achieve impressive zero-shot Text-to-Speech (TTS) by
  fully imitating the acoustic characteristics of a short speech prompt, including
  timbre, prosody, and paralinguistic information. However, such holistic imitation
  limits their ability to isolate and control individual attributes. In this paper,
  we present a unified codec language model SpeechEd'
