  Abstract:

  This study investigates voice mapping as an evaluation framework for text-to-speech
  (TTS) synthesis quality. The study analyzes six TTS models, including historical
  and recent ones. The metrics are crest factor, spectrum balance, and cepstral peak
  prominence (CPPs). We investigated 6 influential TTS models: Merlin, Tacotron 2,
  Transformer TTS, FastSpeech 2, Glow-TTS, '
