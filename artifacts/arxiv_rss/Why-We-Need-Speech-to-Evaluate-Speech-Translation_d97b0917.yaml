content_preview: 'Title: Why We Need Speech to Evaluate Speech Translation


  Authors: Unknown


  Abstract:

  Speech translation models are increasingly capable of preserving speech-specific
  information (e.g., speaker gender, prosody, and emphasis), yet evaluation metrics
  remain blind to such phenomena. We meta-evaluate both text- and speech-based quality
  estimation metrics on two contrastive datasets targeting gender agreement and prosody,
  and find that both fall short, even when given direct access to the speech sign'
