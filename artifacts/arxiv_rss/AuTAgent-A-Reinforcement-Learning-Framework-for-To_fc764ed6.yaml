  Abstract:

  Large Audio Language Models (LALMs) excel at perception but struggle with complex
  reasoning requiring precise acoustic measurements. While external tools can extract
  fine-grained features like exact tempo or pitch, effective integration remains challenging:
  naively using all tools causes information overload, while prompt-based selection
  fails to assess context-dependent utility. T'
