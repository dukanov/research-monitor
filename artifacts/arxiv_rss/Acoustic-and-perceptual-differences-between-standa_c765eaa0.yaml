content_preview: 'Title: Acoustic and perceptual differences between standard and
  accented Chinese speech and their voice clones


  Authors: Unknown


  Abstract:

  Voice cloning is often evaluated in terms of overall quality, but less is known
  about accent preservation and its perceptual consequences. We compare standard and
  heavily accented Mandarin speech and their voice clones using a combined computational
  and perceptual design. Embedding-based analyses show no reliable accented-standard
  difference in original-clon'
