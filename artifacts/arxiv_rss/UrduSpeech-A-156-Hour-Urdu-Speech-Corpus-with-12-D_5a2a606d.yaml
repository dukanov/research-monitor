content_preview: 'Title: UrduSpeech: A 156-Hour Urdu Speech Corpus with 12-Dimension
  Paralinguistic Annotations


  Authors: Unknown


  Abstract:

  Despite 230 million speakers, Urdu remains critically under-resourced in speech
  technology. We introduce UrduSpeech: a large high-fidelity Urdu corpus comprising
  156 hours of audio with 12-dimension paralinguistic metadata, encompassing US-Std,
  US-CS, US-EngPk. To address Right-to-Left script constraints and frequent code-switching,
  we developed UrduSpeech, a LLM-driven pipe'
