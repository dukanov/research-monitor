content_preview: 'Title: Spoken DialogSum: An Emotion-Rich Conversational Dataset
  for Spoken Dialogue Summarization


  Authors: Unknown


  Abstract:

  Recent audio language models can follow long conversations. However, research on
  emotion-aware or spoken dialogue summarization is constrained by the lack of data
  that links speech, summaries, and paralinguistic cues. We introduce Spoken DialogSum,
  the first corpus aligning raw conversational audio with factual summaries, emotion-rich
  summaries, and utterance-level label'
