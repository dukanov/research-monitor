content_preview: 'Title: On the Distillation Loss Functions of Speech VAE for Unified
  Reconstruction, Understanding, and Generation


  Authors: Unknown


  Abstract:

  Continuous speech representations based on Variational Autoencoders (VAEs) have
  emerged as a promising alternative to traditional spectrogram or discrete token
  based features for speech generation and reconstruction. Recent research has tried
  to enrich the structural information in VAE latent representations by aligning with
  self-supervised learning (SSL)'
