content_preview: 'Title: SPG-Codec: Exploring the Role and Boundaries of Semantic
  Priors in Ultra-Low-Bitrate Neural Speech Coding


  Authors: Unknown


  Abstract:

  Conventional neural speech codecs suffer from severe intelligibility degradation
  at ultra-low bitrates, where the bottleneck transitions from acoustic distortion
  to semantic loss. To address this issue, this paper conducts a systematic investigation
  into the role and fundamental limits of integrating frozen semantic priors -- specifically
  HuBERT and Whispe'
