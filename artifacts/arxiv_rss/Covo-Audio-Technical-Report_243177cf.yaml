content_preview: 'Title: Covo-Audio Technical Report


  Authors: Unknown


  Abstract:

  In this work, we present Covo-Audio, a 7B-parameter end-to-end LALM that directly
  processes continuous audio inputs and generates audio outputs within a single unified
  architecture. Through large-scale curated pretraining and targeted post-training,
  Covo-Audio achieves state-of-the-art or competitive performance among models of
  comparable scale across a broad spectrum of tasks, including speech-text modeling,
  spoken dialogue, speech'
