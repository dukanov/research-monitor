  Diffusion


  Authors: Unknown


  Abstract:

  Current speech language models generate responses directly without explicit reasoning,
  leading to errors that cannot be corrected once audio is produced. We introduce
  \textbf{``Silent Thought, Spoken Answer''''} -- a paradigm where speech LLMs generate
  internal text reasoning alongside spoken responses, with thinking traces informing
  speech quality. To realize this, we present \method{}'
