  Abstract:

  This paper presents a lightweight text-to-speech (TTS) system developed for the
  WildSpoof Challenge TTS Track. Our approach fine-tunes the recently released open-weight
  TTS model, \textit{Supertonic}\footnote{\url{https://github.com/supertone-inc/supertonic}},
  with Self-Purifying Flow Matching (SPFM) to enable robust adaptation to in-the-wild
  speech. SPFM mitigates label nois'
