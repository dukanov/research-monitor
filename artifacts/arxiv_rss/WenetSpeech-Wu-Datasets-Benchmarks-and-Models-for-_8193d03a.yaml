  Authors: Unknown


  Abstract:

  Speech processing for low-resource dialects remains a fundamental challenge in developing
  inclusive and robust speech technologies. Despite its linguistic significance and
  large speaker population, the Wu dialect of Chinese has long been hindered by the
  lack of large-scale speech data, standardized evaluation benchmarks, and publicly
  available models. '
