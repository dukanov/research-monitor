content_preview: 'Title: Raon-OpenTTS: Open Models and Data for Robust Text-to-Speech


  Authors: Unknown


  Abstract:

  Recent advances in text-to-speech (TTS) models show impressive speech naturalness
  and quality, yet the role of large-scale open data in driving this progress remains
  underexplored. In this work, we introduce Raon-OpenTTS, an open TTS model that performs
  competitively with state-of-the-art closed-data TTS models, and Raon-OpenTTS-Pool,
  a large-scale open dataset for reproducible TTS training. Raon-Ope'
