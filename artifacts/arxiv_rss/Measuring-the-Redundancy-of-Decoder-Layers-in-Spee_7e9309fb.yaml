content_preview: 'Title: Measuring the Redundancy of Decoder Layers in SpeechLLMs


  Authors: Unknown


  Abstract:

  Speech Large Language Models route speech encoder representations into an LLM decoder
  that typically accounts for over 90% of total parameters. We study how much of this
  decoder capacity is actually needed for speech tasks. Across two LLM families and
  three scales (1-8B), we show that decoder redundancy is largely inherited from the
  pretrained LLM: text and speech inputs yield similar redundant blocks. W'
